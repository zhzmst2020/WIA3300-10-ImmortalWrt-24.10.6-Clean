name: Build WIA3300-10 ImmortalWrt 24.10.6 Clean

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget xsltproc swig time

      - name: Clone ImmortalWrt
        run: |
          git clone --depth 1 --branch openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          cd immortalwrt
          git fetch --tags --depth 1
          git checkout v24.10.6

      - name: Prepare feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Show source revision
        working-directory: immortalwrt
        run: git describe --tags --always

      - name: Stop
        run: echo "Source preparation completed. Hardware configuration will be added in the next commit."
