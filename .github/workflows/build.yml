name: Build WIA3300-10 ImmortalWrt 24.10.6 Clean

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: clean
        type: choice
        options:
          - clean
          - usb-storage
          - usb-printer
          - usb-download
          - usb-extroot

  push:
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'patches/**'
      - 'files/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            rsync \
            unzip \
            zlib1g-dev \
            file \
            wget \
            xsltproc \
            swig \
            time

      - name: Clone ImmortalWrt 24.10.6
        run: |
          git clone --depth 1 \
            --branch v24.10.6 \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          test "$(git -C immortalwrt describe --tags --exact-match)" = "v24.10.6"

      - name: Prepare feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install WIA3300-10 board files
        run: |
          cp \
            patches/mt7621_skspruce_wia3300-10.dts \
            immortalwrt/target/linux/ramips/dts/mt7621_skspruce_wia3300-10.dts

          cat \
            patches/mt7621.mk.append \
            >> immortalwrt/target/linux/ramips/image/mt7621.mk

          mkdir -p immortalwrt/files/etc/config

          cp \
            patches/rc.local \
            immortalwrt/files/etc/rc.local

          cp \
            files/etc/config/fstab \
            immortalwrt/files/etc/config/fstab

          chmod 0755 immortalwrt/files/etc/rc.local

          test -f \
            immortalwrt/target/linux/ramips/dts/mt7621_skspruce_wia3300-10.dts

          test -f \
            immortalwrt/files/etc/config/fstab

      - name: Verify board definition
        run: |
          grep -n \
            '^define Device/skspruce_wia3300-10$' \
            immortalwrt/target/linux/ramips/image/mt7621.mk

          grep -n \
            '^TARGET_DEVICES += skspruce_wia3300-10$' \
            immortalwrt/target/linux/ramips/image/mt7621.mk

          test -f \
            immortalwrt/files/etc/rc.local

          test -f \
            immortalwrt/files/etc/config/fstab

      - name: Apply WIA3300-10 24.10.6 build configuration
        working-directory: immortalwrt
        run: |
          wget -qO .config \
            https://mirrors.vsean.net/openwrt/releases/24.10.6/targets/ramips/mt7621/config.buildinfo

          test -s .config

          cat >> .config <<'EOF'

          #
          # WIA3300-10
          #
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_skspruce_wia3300-10=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_TARGZ=n

          #
          # LuCI / basic system
          #
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl-openssl=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_opkg=y
          CONFIG_PACKAGE_dnsmasq-full=y

          #
          # Transparent proxy kernel support
          #
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nf-socket=y
          CONFIG_PACKAGE_kmod-nf-tproxy=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          #
          # OpenClash PROCESS-NAME support
          #
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-netlink-diag=y

          #
          # Common userspace dependencies
          #
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_lsblk=y

          #
          # Wi-Fi
          #
          CONFIG_PACKAGE_kmod-mt7615-firmware=y

          #
          # USB / storage
          #
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_usbutils=y
          EOF

          PROFILE="${{ github.event.inputs.profile || 'clean' }}"

          case "$PROFILE" in
            clean)
              ;;
            usb-storage|usb-printer|usb-download|usb-extroot)
              cat "../config/profiles/$PROFILE.config" >> .config
              ;;
            *)
              echo "ERROR: unsupported profile: $PROFILE"
              exit 1
              ;;
          esac

          echo "Selected profile: $PROFILE"

      - name: Generate final configuration
        working-directory: immortalwrt
        run: |
          make defconfig

          echo
          echo "========================================"
          echo "TARGET"
          echo "========================================"

          grep -E \
            '^CONFIG_TARGET_(ramips|ramips_mt7621|ramips_mt7621_DEVICE_skspruce_wia3300-10)=' \
            .config || true

          echo
          echo "========================================"
          echo "LUCI / BASIC"
          echo "========================================"

          grep -E \
            '^CONFIG_PACKAGE_(luci|luci-ssl-openssl|luci-compat|opkg|dnsmasq-full)=' \
            .config || true

          echo
          echo "========================================
