name: Build WIA3300-10 ImmortalWrt 24.10.6 Clean

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'patches/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget xsltproc swig time

      - name: Clone ImmortalWrt 24.10.6
        run: |
          git clone --depth 1 --branch v24.10.6 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          test "$(git -C immortalwrt describe --tags --exact-match)" = "v24.10.6"

      - name: Prepare feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install WIA3300-10 board files
        run: |
          cp patches/mt7621_skspruce_wia3300-10.dts             immortalwrt/target/linux/ramips/dts/mt7621_skspruce_wia3300-10.dts
          cat patches/mt7621.mk.append >>             immortalwrt/target/linux/ramips/image/mt7621.mk

      - name: Verify board definition
        working-directory: immortalwrt
        run: |
          test -f target/linux/ramips/dts/mt7621_skspruce_wia3300-10.dts
          grep -n '^define Device/skspruce_wia3300-10$' target/linux/ramips/image/mt7621.mk
          grep -n '^TARGET_DEVICES += skspruce_wia3300-10$' target/linux/ramips/image/mt7621.mk

      - name: Apply build configuration
        run: |
          cp config/wia3300-10.config immortalwrt/.config

      - name: Generate final configuration
        working-directory: immortalwrt
        run: |
          make defconfig
          echo "=== TARGET SELECTION AFTER DEFCONFIG ==="
          grep -E '^CONFIG_TARGET_(ramips|DEVICE_ramips_mt7621_DEVICE_)' .config || true
          echo "=== WIA3300-10 IN TARGET INFO ==="
          grep -n -A12 -B3 'skspruce_wia3300-10' tmp/.targetinfo || true
          echo "=== WIA3300-10 IMAGE PROFILE ==="
          grep -n -A8 -B2 'define Device/skspruce_wia3300-10' target/linux/ramips/image/mt7621.mk || true
          test "$(grep -c '^CONFIG_TARGET_ramips=y

      - name: Download sources
        working-directory: immortalwrt
        run: |
          make download -j8

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          make -j$(nproc) V=s

      - name: Verify and collect firmware
        run: |
          set -eu
          mkdir -p output
          find immortalwrt/bin/targets/ramips/mt7621 -maxdepth 1 -type f -name '*squashfs-sysupgrade.bin' -exec cp {} output/ \;
          test -n "$(find output -maxdepth 1 -type f -name '*squashfs-sysupgrade.bin' -print -quit)"
          if find output -maxdepth 1 -type f -name '*adslr_g7*' | grep -q .; then
            echo "ERROR: wrong device profile adslr_g7 was produced"
            exit 1
          fi
          if ! find output -maxdepth 1 -type f -name '*skspruce_wia3300-10*squashfs-sysupgrade.bin' | grep -q .; then
            echo "ERROR: WIA3300-10 sysupgrade image was not produced"
            ls -lah output
            exit 1
          fi
          ls -lh output

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WIA3300-10-ImmortalWrt-24.10.6-Clean
          path: output/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: WIA3300-10-ImmortalWrt-24.10.6-build-${{ github.run_number }}
          name: WIA3300-10 ImmortalWrt 24.10.6 Clean build ${{ github.run_number }}
          files: output/*
 .config)" = "1"
          test "$(grep -c '^CONFIG_TARGET_ramips_mt7621=y

      - name: Download sources
        working-directory: immortalwrt
        run: |
          make download -j8

      - name: Build firmware
