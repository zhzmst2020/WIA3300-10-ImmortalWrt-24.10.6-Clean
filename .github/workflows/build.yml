name: Build WIA3300-10 ImmortalWrt 24.10.6 Clean

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: clean
        type: choice
        options:
          - clean
          - usb-storage
          - usb-printer
          - usb-download
          - usb-extroot
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'patches/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget xsltproc swig time

      - name: Clone ImmortalWrt 24.10.6
        run: |
          git clone --depth 1 --branch v24.10.6 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          test "$(git -C immortalwrt describe --tags --exact-match)" = "v24.10.6"

      - name: Prepare feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install WIA3300-10 board files
        run: |
          cp patches/mt7621_skspruce_wia3300-10.dts immortalwrt/target/linux/ramips/dts/mt7621_skspruce_wia3300-10.dts
          cat patches/mt7621.mk.append >> immortalwrt/target/linux/ramips/image/mt7621.mk
          mkdir -p immortalwrt/files/etc
          cp patches/rc.local immortalwrt/files/etc/rc.local
          chmod 0755 immortalwrt/files/etc/rc.local

      - name: Verify board definition
        working-directory: immortalwrt
        run: |
          test -f target/linux/ramips/dts/mt7621_skspruce_wia3300-10.dts
          grep -n '^define Device/skspruce_wia3300-10$' target/linux/ramips/image/mt7621.mk
          grep -n '^TARGET_DEVICES += skspruce_wia3300-10$' target/linux/ramips/image/mt7621.mk
          test -f files/etc/rc.local

      - name: Apply build configuration
        env:
          PROFILE: ${{ github.event.inputs.profile || 'clean' }}
        run: |
          cp config/wia3300-10.config immortalwrt/.config
          case "$PROFILE" in
            clean)
              ;;
            usb-storage|usb-printer|usb-download|usb-extroot)
              cat "config/profiles/$PROFILE.config" >> immortalwrt/.config
              ;;
            *)
              echo "ERROR: unsupported profile: $PROFILE"
              exit 1
              ;;
          esac
          echo "Selected profile: $PROFILE"

      - name: Generate final configuration
        working-directory: immortalwrt
        run: |
          make defconfig
          echo 'CONFIG_TARGET_ramips_mt7621_DEVICE_skspruce_wia3300-10=y' >> .config
          echo "=== TARGET ==="
          grep -E '^CONFIG_TARGET_(ramips|ramips_mt7621|ramips_mt7621_DEVICE_skspruce_wia3300-10)=' .config
          echo "=== SELECTED PROFILE ==="
          grep '^CONFIG_TARGET_ramips_mt7621_DEVICE_skspruce_wia3300-10=y$' .config
          echo "=== BASE / OPTIONAL PACKAGES ==="
          grep -E '^CONFIG_PACKAGE_(luci|luci-ssl-openssl|luci-compat|opkg|kmod-mt7615-firmware|kmod-usb3|kmod-usb-storage|block-mount|kmod-fs-ext4|kmod-fs-vfat|usbutils|kmod-nf-socket|kmod-nf-tproxy|kmod-nft-socket|kmod-nft-tproxy)=' .config || true
          test "$(grep -c '^CONFIG_TARGET_ramips=y$' .config)" = "1"
          test "$(grep -c '^CONFIG_TARGET_ramips_mt7621=y$' .config)" = "1"
          test "$(grep -c '^CONFIG_TARGET_ramips_mt7621_DEVICE_skspruce_wia3300-10=y$' .config)" = "1"
          test "$(grep -c '^CONFIG_PACKAGE_luci-compat=y$' .config)" = "1"

      - name: Download sources
        working-directory: immortalwrt
        run: |
          make download -j8

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          make -j$(nproc) V=s

      - name: Verify and collect firmware
        run: |
          set -eu
          mkdir -p output
          find immortalwrt/bin/targets/ramips/mt7621 -maxdepth 1 -type f -name '*squashfs-sysupgrade.bin' -exec cp {} output/ \\;
          test -n "$(find output -maxdepth 1 -type f -name '*squashfs-sysupgrade.bin' -print -quit)"
          if find output -maxdepth 1 -type f -name '*adslr_g7*' | grep -q .; then
            echo "ERROR: wrong device profile adslr_g7 was produced"
            exit 1
          fi
          if ! find output -maxdepth 1 -type f -name '*skspruce_wia3300-10*squashfs-sysupgrade.bin' | grep -q .; then
            echo "ERROR: WIA3300-10 sysupgrade image was not produced"
            ls -lah output
            exit 1
          fi
          ls -lh output

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WIA3300-10-ImmortalWrt-24.10.6-Clean
          path: output/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: WIA3300-10-ImmortalWrt-24.10.6-build-${{ github.run_number }}
          name: WIA3300-10 ImmortalWrt 24.10.6 Clean build ${{ github.run_number }}
          files: output/*
