name: Build WIA3300-10 ImmortalWrt 24.10.6 Clean

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Firmware profile'
        required: true
        default: clean
        type: choice
        options:
          - clean
          - usb-storage
          - usb-printer
          - usb-download
          - usb-extroot
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'patches/**'
      - 'files/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare build environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 \
            libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev \
            lld llvm lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync \
            scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto \
            xxd zlib1g-dev zstd file xsltproc time
          echo "===== HOST ====="
          uname -a
          echo "===== CPU ====="
          nproc
          echo "===== MEMORY ====="
          free -h
          echo "===== DISK ====="
          df -h .

      - name: Clone ImmortalWrt 24.10.6
        run: |
          git clone --depth 1 --branch v24.10.6 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          test "$(git -C immortalwrt describe --tags --exact-match)" = "v24.10.6"

      - name: Prepare feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install WIA3300-10 board files
        run: |
          cp patches/mt7621_skspruce_wia3300-10.dts immortalwrt/target/linux/ramips/dts/mt7621_skspruce_wia3300-10.dts
          cat patches/mt7621.mk.append >> immortalwrt/target/linux/ramips/image/mt7621.mk
          mkdir -p immortalwrt/files/usr
          cp -a files/usr/. immortalwrt/files/usr/
          mkdir -p immortalwrt/files/etc
          cp patches/rc.local immortalwrt/files/etc/rc.local
          chmod 0755 immortalwrt/files/etc/rc.local
          chmod 0755 immortalwrt/files/usr/sbin/wia3300-extroot-setup
          test -x immortalwrt/files/usr/sbin/wia3300-extroot-setup
          sh -n immortalwrt/files/usr/sbin/wia3300-extroot-setup
          # Do not copy files/etc/config/fstab: its legacy automount defaults
          # would override the native fstab configuration and cause surprises.
          test -f immortalwrt/target/linux/ramips/dts/mt7621_skspruce_wia3300-10.dts
          test -f immortalwrt/files/etc/rc.local

      - name: Verify board definition
        run: |
          grep -n '^define Device/skspruce_wia3300-10$' immortalwrt/target/linux/ramips/image/mt7621.mk
          grep -n '^TARGET_DEVICES += skspruce_wia3300-10$' immortalwrt/target/linux/ramips/image/mt7621.mk

      - name: Apply WIA3300-10 build configuration
        working-directory: immortalwrt
        run: |
          wget -qO .config https://mirrors.vsean.net/openwrt/releases/24.10.6/targets/ramips/mt7621/config.buildinfo
          test -s .config
          sed -i '/^CONFIG_PACKAGE_kmod-yt6801=/d; /^CONFIG_PACKAGE_kmod-mdio-netlink=/d' .config

          cat >> .config <<'EOF'

          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_skspruce_wia3300-10=y

          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_ROOTFS_TARGZ=n

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl-openssl=y
          CONFIG_PACKAGE_luci-compat=y
          CONFIG_PACKAGE_opkg=y
          CONFIG_PACKAGE_dnsmasq-full=y

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-nf-socket=y
          CONFIG_PACKAGE_kmod-nf-tproxy=y
          CONFIG_PACKAGE_kmod-nft-compat=y
          CONFIG_PACKAGE_kmod-nft-socket=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-netlink-diag=y

          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_wget=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_ipset=y
          CONFIG_PACKAGE_lsblk=y

          CONFIG_PACKAGE_kmod-mt7615-firmware=y

          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-vfat=y
          CONFIG_PACKAGE_usbutils=y
          EOF

          PROFILE="${{ github.event.inputs.profile || 'clean' }}"
          case "$PROFILE" in
            clean|usb-storage|usb-printer|usb-download|usb-extroot) ;;
            *) echo "ERROR: unsupported profile: $PROFILE"; exit 1 ;;
          esac
          if [ "$PROFILE" != "clean" ]; then
            PROFILE_CONFIG="../config/profiles/$PROFILE.config"
            test -s "$PROFILE_CONFIG" || { echo "ERROR: profile config not found: $PROFILE_CONFIG"; exit 1; }
            echo "Applying profile: $PROFILE_CONFIG"
            cat "$PROFILE_CONFIG" >> .config
          fi

          # The WIA3300-10 build does not require the unrelated yt6801 DKMS driver.
          # Keep it explicitly disabled; the earlier delete alone was not enough
          # because Kconfig selected it again during defconfig.
          printf '\n# CONFIG_PACKAGE_kmod-yt6801 is not set\n# CONFIG_PACKAGE_kmod-mdio-netlink is not set\n' >> .config

          echo "Selected profile: $PROFILE"

      - name: Generate final configuration
        working-directory: immortalwrt
        run: |
          make defconfig

          echo "========================================"
          echo "YT6801 DRIVER CHECK"
          echo "========================================"
          if grep -q '^CONFIG_PACKAGE_kmod-yt6801=y$' .config; then
            echo "ERROR: unrelated kmod-yt6801 was re-enabled by Kconfig."
            exit 1
          fi
          echo "OK: kmod-yt6801 is disabled."
          if grep -Eq '^CONFIG_PACKAGE_kmod-mdio-netlink=(y|m)$' .config; then
            echo "ERROR: unrelated kmod-mdio-netlink was re-enabled by Kconfig."
            exit 1
          fi
          echo "OK: kmod-mdio-netlink is disabled."

          grep -E '^CONFIG_TARGET_(ramips|ramips_mt7621|ramips_mt7621_DEVICE_skspruce_wia3300-10)=' .config || true

          echo "========================================"
          echo "EXTROOT SUPPORT"
          echo "========================================"
          grep -E '^CONFIG_PACKAGE_(block-mount|e2fsprogs|kmod-usb-storage|kmod-fs-ext4)=' .config || true
          grep -q '^CONFIG_PACKAGE_block-mount=y$' .config
          grep -q '^CONFIG_PACKAGE_e2fsprogs=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-usb-storage=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-fs-ext4=y$' .config
          echo "OK: native extroot filesystem packages selected."

          echo "========================================"
          echo "PROXY KERNEL SUPPORT"
          echo "========================================"
          grep -E '^CONFIG_PACKAGE_(kmod-tun|kmod-nf-socket|kmod-nf-tproxy|kmod-nft-compat|kmod-nft-socket|kmod-nft-tproxy|kmod-inet-diag|kmod-netlink-diag)=' .config || true

          echo "========================================"
          echo "OPENCLASH KMOD CHECK"
          echo "========================================"
          grep -q '^CONFIG_PACKAGE_kmod-inet-diag=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-netlink-diag=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-tun=y$' .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-tproxy=y$' .config
          echo "OK: OpenClash kernel dependency packages selected."

          echo "========================================"
          echo "CLEAN PROXY BODY CHECK"
          echo "========================================"
          if grep -Eq '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-passwall|luci-app-passwall2|luci-app-ssr-plus|sing-box|xray-core|v2ray-core)=' .config; then
            echo "ERROR: proxy plugin/core unexpectedly selected."
            exit 1
          fi
          echo "OK: clean proxy base confirmed."

          echo "========================================"
          echo "KERNEL DIAG CONFIG"
          echo "========================================"
          grep -E '^(CONFIG_INET_DIAG|CONFIG_INET_TCP_DIAG|CONFIG_INET_UDP_DIAG|CONFIG_INET_RAW_DIAG)=' .config || true

          echo "BASE CONFIGURATION CHECK PASSED"

      - name: Download sources
        working-directory: immortalwrt
        run: |
          make download -j8

      - name: Build firmware
        working-directory: immortalwrt
        run: |
          set +e
          echo "===== BUILD HOST =====" | tee build.log
          uname -a | tee -a build.log
          echo "CPU: $(nproc)" | tee -a build.log
          free -h | tee -a build.log
          df -h . | tee -a build.log
          echo "===== BUILD START =====" | tee -a build.log

          make -j2 V=s > build.full.log 2>&1
          rc=$?

          echo "===== BUILD RETURN CODE: $rc =====" | tee -a build.log
          echo "===== LAST 300 LINES =====" | tee -a build.log
          tail -n 300 build.full.log | tee -a build.log
          echo "===== ERROR SUMMARY =====" | tee -a build.log
          grep -nE 'fatal error:|error:|Error:|ERROR:|Killed|cc1plus:|collect2:|make\[[0-9]+\]: \*\*\*' build.full.log | tail -n 100 | tee -a build.log || true

          exit "$rc"

      - name: Verify generated kernel modules
        working-directory: immortalwrt
        run: |
          set -eu
          OUTDIR="bin/targets/ramips/mt7621"

          echo "========================================"
          echo "SEARCH INET DIAG PACKAGES"
          echo "========================================"
          find "$OUTDIR" -type f \( -name '*inet-diag*.ipk' -o -name '*netlink-diag*.ipk' \) -print | sort || true

          echo "========================================"
          echo "SEARCH KERNEL MODULE FILES"
          echo "========================================"
          find staging_dir -type f \( -name 'inet_diag.ko' -o -name 'tcp_diag.ko' -o -name 'udp_diag.ko' -o -name 'raw_diag.ko' \) -print | sort || true

          echo "========================================"
          echo "REQUIRED MODULE CHECK"
          echo "========================================"
          test -n "$(find staging_dir -type f -name 'inet_diag.ko' -print -quit)"
          echo "OK: inet_diag.ko exists."

      - name: Verify firmware output
        run: |
          set -eu
          OUTDIR="immortalwrt/bin/targets/ramips/mt7621"
          test -d "$OUTDIR"

          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"
          ls -lah "$OUTDIR"

          mkdir -p output
          found=0

          for f in "$OUTDIR"/*squashfs-sysupgrade.bin; do
            [ -f "$f" ] || continue
            if printf '%s\n' "$(basename "$f")" | grep -Eq 'skspruce_wia3300-10.*squashfs-sysupgrade\.bin'; then
              cp -f "$f" output/
              found=1
            fi
          done

          if [ "$found" -ne 1 ]; then
            echo "ERROR: WIA3300-10 sysupgrade image was not found."
            find "$OUTDIR" -maxdepth 1 -type f -name '*squashfs-sysupgrade.bin' -print | sort || true
            exit 1
          fi

          ls -lh output
          echo "FIRMWARE CHECK PASSED"

      - name: Upload build failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WIA3300-10-build-failure-logs-${{ github.run_number }}
          path: |
            immortalwrt/build.log
            immortalwrt/build.full.log
          if-no-files-found: warn

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WIA3300-10-ImmortalWrt-24.10.6-Clean
          path: output/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: WIA3300-10-ImmortalWrt-24.10.6-build-${{ github.run_number }}
          name: WIA3300-10 ImmortalWrt 24.10.6 Clean build ${{ github.run_number }}
          files: output/*
