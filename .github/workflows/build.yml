name: Build WIA3300-10 ImmortalWrt 24.10.6 Clean

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'patches/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Prepare build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file wget xsltproc swig time

      - name: Clone ImmortalWrt 24.10.6
        run: |
          git clone --depth 1 --branch openwrt-24.10 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          cd immortalwrt
          git fetch --tags --depth 1
          git checkout v24.10.6

      - name: Prepare feeds
        working-directory: immortalwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install WIA3300-10 board files
        run: |
          cp patches/mt7621_skspruce_wia3300-10.dts immortalwrt/target/linux/ramips/dts/mt7621_skspruce_wia3300-10.dts
          awk 'BEGIN { while ((getline line < "../patches/mt7621.mk.append") > 0) extra = extra line "\n" } /^\$\(eval \$\(call BuildImage\)\)$/ { printf "%s", extra } { print }' immortalwrt/target/linux/ramips/image/mt7621.mk > /tmp/mt7621.mk
          mv /tmp/mt7621.mk immortalwrt/target/linux/ramips/image/mt7621.mk

      - name: Verify board definition
        working-directory: immortalwrt
        run: |
          grep -n 'skspruce_wia3300-10' target/linux/ramips/image/mt7621.mk
          test -f target/linux/ramips/dts/mt7621_skspruce_wia3300-10.dts

      - name: Apply build configuration
        run: cp config/wia3300-10.config immortalwrt/.config

      - name: Generate final configuration
        working-directory: immortalwrt
        run: |
          make defconfig
          grep -E 'CONFIG_TARGET_ramips_mt7621|CONFIG_TARGET_DEVICE_ramips_mt7621_DEVICE_skspruce_wia3300-10|CONFIG_PACKAGE_luci-compat|CONFIG_PACKAGE_kmod-mt7615-firmware|CONFIG_PACKAGE_kmod-usb3|CONFIG_PACKAGE_nftables' .config

      - name: Download sources
        working-directory: immortalwrt
        run: make download -j8

      - name: Build firmware
        working-directory: immortalwrt
        run: make -j$(nproc) V=s

      - name: Collect firmware
        run: |
          mkdir -p output
          find immortalwrt/bin/targets/ramips/mt7621 -maxdepth 1 -type f -name '*squashfs-sysupgrade.bin' -exec cp {} output/ \;
          test -n "$(find output -type f -name '*.bin' -print -quit)"
          ls -lh output

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: WIA3300-10-ImmortalWrt-24.10.6-Clean
          path: output/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: WIA3300-10-ImmortalWrt-24.10.6-build-${{ github.run_number }}
          name: WIA3300-10 ImmortalWrt 24.10.6 Clean build ${{ github.run_number }}
          files: output/*

